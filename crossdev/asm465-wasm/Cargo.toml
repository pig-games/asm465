[package]
name = "asm465-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asm465 = { path = "../asm465", default-features = false, features = ["web-service"] }
eframe = { version = "0.24", features = ["default_fonts", "glow"] }
egui = "0.24"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.5", features = ["websocket"] }
gloo-utils = "0.2"
gloo-file = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
console_error_panic_hook = "0.1"
futures = "0.3"
web-sys = { version = "0.3", features = ["Url", "UrlSearchParams", "Window", "Document", "HtmlButtonElement", "HtmlInputElement"] }
