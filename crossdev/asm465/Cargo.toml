[package]
name = "asm465"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.11"
bevy_egui = "0.21"
bus = { path = "../cross465/bus" }
core6502 = { path = "../cross465/core6502" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
log = "0.4"
uuid = { version = "1.8", features = ["js"] }
clap = { version = "4", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
rfd = "0.14"
runtime_sdk = { path = "../cross465/runtime_sdk" }
instant = "0.1"

[features]
default = ["native-service", "native-file-dialog"]
native-service = ["clap", "crossbeam-channel"]
native-file-dialog = []
dev-loopback = []

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = { version = "0.5", features = ["websocket"] }
futures = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Url", "UrlSearchParams", "Event", "DomException", "File"] }
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
