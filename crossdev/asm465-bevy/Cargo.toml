[package]
name = "asm465-bevy"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.11"
bevy_egui = "0.21"
bus = { path = "../cross465/bus" }
core6502 = { path = "../cross465/core6502" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
clap = { version = "4", features = ["derive"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
rfd = { version = "0.14", optional = true }

[features]
default = ["native-service", "native-file-dialog"]
native-service = ["clap", "crossbeam-channel"]
native-file-dialog = ["rfd"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
