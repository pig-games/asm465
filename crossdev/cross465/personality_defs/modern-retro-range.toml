[personality]
id = "modern-retro-range"
title = "Modern Retro (Range)"
default_map_priority = 10

[modules.console]
impl = "console.text"

[modules.display]
impl = "display.basic2d"

[modules.sprite]
impl = "sprite.basic"

[modules.system]
impl = "system.interrupts"

[modules.input]
impl = "input.joystick"

[[map]]
priority = 10
decode = { range = { addr = "DF00..=DF1F", kind = "console", order = [
  "WriteChar","Newline","WriteHex","Clear",
  "CursorX","CursorY","CursorApply","Foreground","Background",
  "PointerLo","PointerHi","PrintBlock"
] } }

[[map]]
priority = 10
decode = { range = { addr = "DF20..=DF21", kind = "display", order = [
  "BorderColor","BackgroundColor"
] } }

[[map]]
priority = 10
decode = { range = { addr = "DF30..=DF38", kind = "sprite", order = [
  "Select","Number","Anim","XHi","XLo","YHi","YLo","Scale","Enable"
] } }

[[map]]
priority = 10
decode = { range = { addr = "DF40..=DF4B", kind = "system", order = [
  "IrqPending","IrqEnable","IrqAck","IrqSource",
  "NmiPending","NmiAck","Status","RasterLo","RasterCompareLo",
  "RasterCompareHi","SpriteCollisions","BackgroundCollisions"
] } }

[[map]]
priority = 10
decode = { instances = { kind = "input", selector = "Select", count = 4, index_var = "p", layout = [
  { addr = "DF50 + (p * 4) + 0", id = "ButtonsLo" },
  { addr = "DF50 + (p * 4) + 1", id = "ButtonsHi" },
  { addr = "DF50 + (p * 4) + 2", id = "PotX" },
  { addr = "DF50 + (p * 4) + 3", id = "PotY" }
] } }

[interrupts]
irq_sources = [
  { kind = "system", id = "IrqPending" }
]
