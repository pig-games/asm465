[personality]
id = "c64-compat-sparse"
title = "C64-Compatible Sparse Layout"
default_map_priority = 10

[[mirror]]
range = "D000..=D3FF"
period = 0x040

[[open_bus]]
range = "D000..=DFFF"
policy = "last_read"

[modules.console]
impl = "console.text"

[modules.display]
impl = "display.basic2d"

[modules.sprite]
impl = "sprite.basic"

[modules.system]
impl = "system.interrupts"

[modules.input]
impl = "input.joystick"

[[map]]
priority = 10
decode = { sparse = [
  { addr = "D020", kind = "display", id = "BorderColor" },
  { addr = "D021", kind = "display", id = "BackgroundColor" }
] }

[[map]]
priority = 10
decode = { sparse = [
  { addr = "D012", kind = "system", id = "RasterCompareLo" },
  { addr = "D011", kind = "system", id = "RasterCompareHi", field = { bit = 7, target_bit = 0 } }
] }

[[map]]
priority = 10
decode = { instances = { kind = "sprite", selector = "Select", count = 8, index_var = "i", layout = [
  { addr = "D100 + (i*8)", id = "Number" },
  { addr = "D101 + (i*8)", id = "Anim" },
  { addr = "D102 + (i*8)", id = "XLo" },
  { addr = "D103 + (i*8)", id = "XHi" },
  { addr = "D104 + (i*8)", id = "YLo" },
  { addr = "D105 + (i*8)", id = "Scale" },
  { addr = "D010", id = "XHi", field = { bit = "i" } },
  { addr = "D015", id = "Enable", field = { bit = "i" } }
] } }


[[map]]
priority = 10
decode = { sparse = [
  { addr = "D019", kind = "system", id = "IrqPending", field_policies = [
      { lsb = 0, msb = 7, on_read = "irq_ack_bits" }
  ] },
  { addr = "D01A", kind = "system", id = "IrqEnable" },
  { addr = "D01B", kind = "system", id = "IrqAck" },
  { addr = "D01C", kind = "system", id = "IrqSource" },
  { addr = "D01D", kind = "system", id = "NmiPending" }
] }

[[map]]
priority = 10
decode = { instances = { kind = "input", selector = "Select", count = 2, index_var = "p", layout = [
  { addr = "DC00 + p", id = "PortA" }
] } }

[[map]]
priority = 10
decode = { sparse = [
  { addr = "D419", kind = "input", id = "PotX", transform = { pre_read_sets = [{ kind = "input", id = "Select", value = 0 }], pre_write_sets = [{ kind = "input", id = "Select", value = 0 }] } },
  { addr = "D41A", kind = "input", id = "PotY", transform = { pre_read_sets = [{ kind = "input", id = "Select", value = 0 }], pre_write_sets = [{ kind = "input", id = "Select", value = 0 }] } }
] }

[[map]]
priority = 10
decode = { sparse = [
  { addr = "D01E", kind = "system", id = "SpriteCollisions", compute = "coll.spr_spr & 0xFF", suppress_write = true },
  { addr = "D01F", kind = "system", id = "BackgroundCollisions", compute = "coll.spr_bg & 0xFF", suppress_write = true }
] }
