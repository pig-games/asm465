[package]
name = "cross465-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cross465-test-runner"
path = "src/bin/cross465-test-runner.rs"

[dependencies]
anyhow = "1.0"
bus = { path = "../bus" }
clap = { version = "4.5", features = ["derive"] }
core6502 = { path = "../core6502" }
runtime_sdk = { path = "../runtime_sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
thiserror = "1.0"
toml = "0.8"
ureq = "2.9"
