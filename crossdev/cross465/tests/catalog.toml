workspace = "../../.."

[[case]]
name = "math::add_basic"
path = "cases/math_add_basic.s"
timeout_ms = 1500

tags = ["demo", "rtst"]

[[case]]
name = "display::parallax_scroll2"
path = "cases/display_parallax_scroll.s"
timeout_ms = 2000

[ci.matrix.cross465]
personalities = ["modern-retro", "c64-compat"]
include = [
  "native/src/include",
  "native/src/platform/cross465/include"
]
define = { PLATFORM = "cross465" }
tass_args = ["-Wall"]
remote_failure = "error"

[ci.matrix.ultimate64]
personalities = []
include = [
  "native/src/include",
  "native/src/platform/ultimate64/include"
]
tass_args = ["-DREMOTE"]
remote_failure = "warn"

[ci.matrix.ultimate64.define]
FEATURE = "1"

[ci.matrix.ultimate64.endpoint]
host = "192.168.0.64"
port = 6510

[ci.matrix.mega65]
personalities = ["modern-retro"]
include = [
  "native/src/include",
  "native/src/platform/mega65/include"
]
tass_args = ["-Wall"]
