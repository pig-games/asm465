[package]
name = "opfoundry-server"
version = "0.1.0"
edition = "2021"

[dependencies]
opfoundry-gui = { path = "../opfoundry-gui", default-features = false }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = "0.21"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
